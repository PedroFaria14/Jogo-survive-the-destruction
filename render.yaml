services:
  - type: web
    name: jogo-survive-the-destruction
    runtime: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    envVars:
      # DATABASE_URL é um secret gerenciado: defina-o no painel do Render
      # (Service > Environment) e não versionado no repositório. O valor abaixo
      # força a configuração manual (sync: false), evitando vazamento de secrets.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://jogo-survive-the-destruction.vercel.app
      - key: HTTP_ADDR
        value: ":8080"
